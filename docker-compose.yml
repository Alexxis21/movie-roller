services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      # Keep the SQLite database on your machine so data survives rebuilds
      - ./dev.db:/app/dev.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
